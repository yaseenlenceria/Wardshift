name: Prerender static HTML

on:
  push:
    branches: [main]
    paths-ignore:
      - "prerendered/**"
      - ".github/**"

permissions:
  contents: write

jobs:
  prerender:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: node scripts/sync-prerendered.mjs save
      - name: Commit prerendered HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prerendered
          if git diff --cached --quiet; then
            echo "No prerendered changes"
          else
            git commit -m "Refresh prerendered HTML [skip ci]"
            git push
          fi
